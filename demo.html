<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Demo Presentation - Antigravity</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26A1;</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --cyan: #00ff41;
            --bg-base: #050505;
            --glass-bg: rgba(15, 20, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        
        * {
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-base); 
            color: #fff; 
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 65, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 195, 255, 0.05) 0%, transparent 50%);
        }

        /* Nav Header */
        .demo-nav {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            position: sticky;
            top: 0;
            width: 100%;
        }

        .demo-back-btn {
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 600; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.82rem; 
            color: var(--cyan); 
            text-decoration: none; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 8px 16px;
            border: 1px solid rgba(0, 255, 65, 0.35);
            border-radius: 8px;
            background: rgba(0, 255, 65, 0.08);
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .demo-back-btn:hover { 
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
            transform: translateY(-2px);
        }

        .demo-title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .demo-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: #a1a1aa;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .demo-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Container & Media */
        .demo-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 32px 20px;
            width: 100%;
        }

        .media-glass-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            border-radius: 16px;
            padding: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.2),
                0 24px 60px rgba(0,0,0,0.85);
            opacity: 1;
            transform: none;
            display: block;
        }

        .mac-controls {
            display: flex;
            gap: 8px;
            position: absolute;
            top: 18px;
            left: 20px;
            z-index: 2;
        }

        .mac-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .mac-dot.close { background: #ff5f56; border: 1px solid #e0443e; }
        .mac-dot.min { background: #ffbd2e; border: 1px solid #dea123; }
        .mac-dot.max { background: #27c93f; border: 1px solid #1aab29; }

        @keyframes cinematicReveal {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .media-content-container {
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            position: relative;
            width: 100%;
            min-height: 280px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
            padding-top: 40px;
            background: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .media-content {
            display: block;
            width: 100%;
            height: auto;
            max-height: calc(85vh - 100px);
            object-fit: contain;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        /* Tap to Play Overlay */
        .tap-play-overlay {
            position: absolute;
            inset: 40px 0 0 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 8;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .tap-play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--cyan);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.5);
            transition: transform 0.2s ease;
        }

        .tap-play-btn svg {
            margin-left: 4px;
        }

        .tap-play-overlay:hover .tap-play-btn {
            transform: scale(1.1);
        }

        .tap-play-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Loading State */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 5;
        }
        
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(0, 255, 65, 0.15);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loader-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--cyan);
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* Error */
        .error-message {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: #f87171;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(239, 68, 68, 0.1);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.25);
            text-align: center;
            margin: 20px;
        }
        
        /* Grid Lines Background */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
            pointer-events: none;
        }

        @media (max-width: 640px) {
            .demo-nav { padding: 12px 16px; }
            .demo-back-btn { padding: 6px 12px; font-size: 0.75rem; }
            .demo-title { font-size: 0.95rem; }
            .demo-subtitle { font-size: 0.6rem; }
            .demo-container { padding: 16px 12px; }
            .media-glass-wrapper { padding: 6px; border-radius: 12px; }
            .mac-controls { top: 14px; left: 14px; }
            .media-content-container { padding-top: 36px; min-height: 220px; }
            .media-content { max-height: calc(75vh - 60px); }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    
    <nav class="demo-nav">
        <a href="/#projects" class="demo-back-btn">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back
        </a>
        <div class="demo-title-wrapper">
            <div class="demo-subtitle">Live Presentation</div>
            <div class="demo-title" id="demo-title-display">Project Showcase</div>
        </div>
        <div style="width: 70px;"></div> <!-- Spacer for flex alignment -->
    </nav>

    <div class="demo-container">
        <div class="media-glass-wrapper" id="media-wrapper">
            <div class="mac-controls">
                <div class="mac-dot close"></div>
                <div class="mac-dot min"></div>
                <div class="mac-dot max"></div>
            </div>
            <div class="media-content-container">
                <div class="loader" id="media-loader">
                    <div class="spinner"></div>
                    <div class="loader-text">LOADING MEDIA...</div>
                </div>
                <!-- Media injected dynamically -->
            </div>
            <div style="text-align: center; padding: 10px 0 4px;">
                <a id="direct-media-link" href="#" target="_blank" rel="noopener noreferrer" style="color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; text-decoration: underline;">Open Raw Media File ↗</a>
            </div>
        </div>
        <div class="error-message" id="error-message">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>
            </svg>
            <span id="error-text">Media parameter missing or invalid.</span>
            <a href="/#projects" style="color: var(--cyan); text-decoration: underline; margin-top: 8px; font-size: 0.85rem;">Return to Projects</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mediaParam = urlParams.get('v');
            const projectParam = urlParams.get('p');
            
            const wrapper = document.querySelector('.media-content-container');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const titleDisplay = document.getElementById('demo-title-display');
            const loader = document.getElementById('media-loader');
            const glassWrapper = document.getElementById('media-wrapper');
            const directLink = document.getElementById('direct-media-link');

            if (projectParam) {
                titleDisplay.textContent = projectParam;
            }

            if (!mediaParam) {
                glassWrapper.style.display = 'none';
                errorMsg.style.display = 'flex';
                return;
            }

            // Robust path construction
            let mediaPath = mediaParam;
            if (!mediaPath.startsWith('/') && !mediaPath.startsWith('http')) {
                mediaPath = '/images/projects/' + mediaPath;
            }

            if (directLink) {
                directLink.href = mediaPath;
            }

            const isVideo = mediaPath.match(/\.(mp4|webm|mov)$/i);

            const hideLoader = () => {
                if (loader) loader.style.display = 'none';
            };

            // Hide loader after 2s safety fallback
            setTimeout(hideLoader, 2500);

            if (isVideo) {
                const video = document.createElement('video');
                video.className = 'media-content';
                video.controls = true;
                video.loop = true;
                video.muted = true;
                video.autoplay = true;
                video.preload = 'auto';
                
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.setAttribute('muted', '');
                video.setAttribute('autoplay', '');
                video.setAttribute('loop', '');
                video.setAttribute('controls', '');
                video.src = mediaPath;

                video.addEventListener('loadeddata', hideLoader);
                video.addEventListener('loadedmetadata', hideLoader);
                video.addEventListener('canplay', hideLoader);
                video.addEventListener('play', hideLoader);
                
                video.addEventListener('error', () => {
                    hideLoader();
                    glassWrapper.style.display = 'none';
                    errorText.textContent = 'Unable to play video directly in browser.';
                    errorMsg.style.display = 'flex';
                });

                wrapper.appendChild(video);

                // Try playing and handle autoplay restriction
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        hideLoader();
                    }).catch(() => {
                        hideLoader();
                        const overlay = document.createElement('div');
                        overlay.className = 'tap-play-overlay';
                        overlay.innerHTML = `
                            <div class="tap-play-btn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                            <span class="tap-play-text">TAP TO PLAY DEMO</span>
                        `;
                        overlay.onclick = () => {
                            video.play();
                            overlay.remove();
                        };
                        wrapper.appendChild(overlay);
                    });
                }
            } else {
                const img = document.createElement('img');
                img.className = 'media-content';
                img.alt = projectParam ? `${projectParam} Demo` : 'Project Demo';
                img.loading = 'eager';
                img.decoding = 'async';
                img.src = mediaPath;

                img.onload = hideLoader;
                img.onerror = () => {
                    hideLoader();
                    glassWrapper.style.display = 'none';
                    errorText.textContent = 'Unable to load demo image preview.';
                    errorMsg.style.display = 'flex';
                };

                wrapper.appendChild(img);
            }
        });
    </script>
</body>
</html>
